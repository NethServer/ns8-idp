name: Realm lock regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  realm-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p test_realm_lock.py -v
