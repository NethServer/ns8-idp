name: Test module
# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run_tests:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # TODO: switch back to @v1 when NethServer/ns8-github-actions#67 is merged
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@feat-qemu-alternate-legs
    with:
      ci_actions_ref: feat-qemu-alternate-legs
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
