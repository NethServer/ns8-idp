name: Test module
# The run belongs to the default branch under workflow_run: name the tested one.
run-name: "Test ${{ github.event.workflow_run.head_branch || github.ref_name }} on QEMU"

on:
  workflow_dispatch:
    inputs:
      debug_shell:
        description: "Debug shell"
        required: true
        type: boolean
  workflow_run:
    workflows: ["Publish images"]
    types: [completed]

jobs:
  run_tests:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      debug_shell: ${{ github.event.inputs.debug_shell == 'true' }}
      # TODO: remove when NethServer/dev#8188 is released: Keycloak reaches
      # ldapproxy from the pod only if it listens on all IPv4 addresses
      install_args: ghcr.io/nethserver/ldapproxy:feat-8188
